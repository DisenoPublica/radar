[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# El tablero pide /api/datos; Netlify lo resuelve a la función de lectura.
[[redirects]]
  from = "/api/datos"
  to = "/.netlify/functions/datos"
  status = 200

[[redirects]]
  from = "/api/periodo"
  to = "/.netlify/functions/periodo"
  status = 200

[[redirects]]
  from = "/api/lectura"
  to = "/.netlify/functions/lectura"
  status = 200
